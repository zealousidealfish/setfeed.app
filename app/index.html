<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setfeed App</title><meta name="description" content="Open the Setfeed web app."><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="./assets/app.css"><script src="./assets/config.js"></script><script defer src="./assets/shell.js"></script></head><body class="page-bg" data-app-page="dashboard" data-app-title="Home" data-app-description="Send delayed messages and manage what opens next."><div id="setfeed-app"></div><div id="app-page-content" class="app-grid"><section class="app-panel"><h2>Quick actions</h2><div class="app-actions"><a class="btn btn-primary" href="./send.html">Send a Setfeed</a><a class="btn btn-secondary" href="./upcoming.html">View Upcoming</a><a class="btn btn-quiet" href="./inbox.html">Open Inbox</a></div></section><section class="app-panel"><h2>Message summary</h2><div class="app-summary-grid"><a href="./upcoming.html"><strong id="dashboard-upcoming">—</strong><span>Upcoming</span></a><a href="./inbox.html"><strong id="dashboard-inbox">—</strong><span>Inbox</span></a><a href="./feed.html"><strong id="dashboard-feed">—</strong><span>Feed</span></a></div><p id="dashboard-status" class="help" role="status" aria-live="polite"></p></section><section class="app-panel"><h2>Self-messages</h2><p>Use <strong>/setfeed self</strong> in Discord to schedule a message to yourself. It will appear in Upcoming and can be marked Awaiting for a Discord release notification.</p><a class="btn btn-quiet" href="./settings.html">Discord setup</a></section></div></body></html>
