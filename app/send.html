<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send · Setfeed</title><meta name="description" content="Send a delayed Setfeed to another account."><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="./assets/app.css"><script src="./assets/config.js"></script><script defer src="./assets/shell.js"></script></head><body class="page-bg" data-app-page="send" data-app-title="Send" data-app-description="Schedule a private message for another Setfeed account."><div id="setfeed-app"></div><div id="app-page-content" class="app-grid"><section class="app-panel"><h2>Choose a recipient</h2><form id="recipient-search-form" class="app-form"><div class="field"><label for="recipient-username">Setfeed username</label><input id="recipient-username" autocomplete="off" minlength="3" maxlength="24" placeholder="username" required></div><div class="app-actions"><button class="btn btn-primary" id="recipient-search-button" type="submit">Find recipient</button></div><p id="recipient-message" class="help" role="status" aria-live="polite"></p></form><div id="recipient-search-result" class="app-recipient-list" aria-label="Search result"></div></section><section class="app-panel"><h2>Contacts</h2><p id="recipient-contacts-message" class="help" role="status" aria-live="polite"></p><div id="recipient-contacts" class="app-recipient-list"></div><div id="recipient-contacts-empty" class="app-empty">No saved contacts are available.</div></section><section class="app-panel" id="recipient-selected" hidden><h2>Selected recipient</h2><p id="recipient-selected-name"></p><div class="app-actions"><button class="btn btn-quiet" id="recipient-clear" type="button">Choose someone else</button></div></section><section class="app-panel"><h2>Message</h2><p>The message, delivery time and final scheduling action will be connected in the next task.</p></section></div></body></html>
