<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · Setfeed</title><meta name="description" content="Manage Setfeed account and Discord guidance."><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="./assets/app.css"><script src="./assets/config.js"></script><script defer src="./assets/shell.js"></script></head><body class="page-bg" data-app-page="settings" data-app-title="Settings" data-app-description="Manage your profile and Discord notification setup."><div id="setfeed-app"></div><div id="app-page-content" class="app-grid"><section class="app-panel"><h2>Discord notifications</h2><p>In Discord, use <strong>/setfeed link</strong> to link your account, <strong>/setfeed status</strong> to check it, and <strong>/setfeed receiving enabled:true</strong> to allow Setfeed DMs.</p><p class="help">The website can show whether your profile is Discord-linked. Receiving is currently managed through the Discord command.</p></section></div></body></html>
