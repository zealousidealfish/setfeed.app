<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Completing Discord sign-in · Setfeed</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="./assets/discord-auth.js"></script>
  <script>
    const firebaseConfig = { apiKey: "AIzaSyCECKG-00tijJrt5qvRy3L27ZzE7bocNrU", authDomain: "setfeed-fcd7a.firebaseapp.com", projectId: "setfeed-fcd7a", storageBucket: "setfeed-fcd7a.firebasestorage.app", messagingSenderId: "553573263069", appId: "1:553573263069:web:e5c9884101ca38eaee1d34" };
    if (!firebase.apps || firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);
    window.sfAuth = firebase.auth();
    window.sfAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
  </script>
</head>
<body class="page-bg">
  <main class="wrap">
    <div class="card" style="max-width: 720px; margin: 0 auto;">
      <section class="panel" aria-labelledby="title">
        <p class="panel-title" id="title">Completing Discord sign-in…</p>
        <p class="panel-sub" id="message" aria-live="polite">Please wait while Setfeed verifies your Discord sign-in.</p>
        <div class="actions" style="margin-top: var(--s-3);">
          <button class="btn btn-lg btn-secondary hidden" id="restart" type="button">Start a new Discord sign-in</button>
          <button
            class="btn btn-lg btn-primary hidden"
            id="create-account"
            type="button"
          >
            Create Setfeed account with Discord
          </button>
          <button
            class="btn btn-lg btn-secondary hidden"
            id="continue-discord"
            type="button"
          >
            Continue with Discord
          </button>
          <a class="btn btn-lg btn-quiet" href="./">Back to Setfeed</a>
        </div>
      </section>
    </div>
  </main>
  <script>
    const auth = window.sfAuth;
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const restart = document.getElementById("restart");
    const createAccount = document.getElementById("create-account");
    const continueDiscord = document.getElementById("continue-discord");
    let restartDestination =
      window.SetfeedDiscordAuth.DEFAULT_DESTINATION;
    let restartIntent = "continue";

    function show(text, line) {
      title.textContent = text;
      message.textContent = line;
    }

    let recoveryStartInFlight = false;

    function recoveryButtons() {
      return [restart, createAccount, continueDiscord];
    }

    function visibleRecoveryButtons() {
      return recoveryButtons().filter((button) => !button.classList.contains("hidden"));
    }

    function resetRecoveryButtons() {
      recoveryButtons().forEach((button) => {
        button.classList.add("hidden");
        button.disabled = false;
        button.removeAttribute("aria-busy");
      });
    }

    function renderRecovery(mapped) {
      resetRecoveryButtons();

      if (mapped.code === "discord_not_linked") {
        restart.textContent = "Try Continue with Discord again";
        restart.classList.remove("hidden");
        createAccount.classList.remove("hidden");
        return;
      }

      if (mapped.code === "discord_already_linked") {
        continueDiscord.classList.remove("hidden");
        return;
      }

      restart.textContent = restartIntent === "create_account"
        ? "Try account creation again"
        : "Try Continue with Discord again";
      restart.classList.remove("hidden");
    }

    async function startFresh(button, intent) {
      if (recoveryStartInFlight || button.disabled) return;
      recoveryStartInFlight = true;
      visibleRecoveryButtons().forEach((visibleButton) => { visibleButton.disabled = true; });
      button.setAttribute("aria-busy", "true");
      try {
        const url = await window.SetfeedDiscordAuth.startDiscordSignIn({
          auth,
          destination: restartDestination,
          intent,
        });
        window.location.assign(url);
      } catch (error) {
        recoveryStartInFlight = false;
        const mapped = window.SetfeedDiscordAuth.mapError(error && error.code, error && error.retryAfter);
        show(mapped.title, mapped.message);
        renderRecovery(mapped);
      }
    }

    restart.addEventListener("click", () => startFresh(restart, restartIntent));
    createAccount.addEventListener("click", () => startFresh(createAccount, "create_account"));
    continueDiscord.addEventListener("click", () => startFresh(continueDiscord, "continue"));

    (async function complete() {
      const parsed = window.SetfeedDiscordAuth.parseResultFragment(window.location.hash);
      history.replaceState(null, "", window.location.pathname + window.location.search);
      const state = window.SetfeedDiscordAuth.validateStoredState();
      if (state.ok) {
        restartDestination = state.destination;
        restartIntent = state.intent;
      }

      if (!state.ok) {
        window.SetfeedDiscordAuth.clearState();
        const mapped = window.SetfeedDiscordAuth.mapError(state.code);
        show(mapped.title, mapped.message);
        renderRecovery(mapped);
        return;
      }

      if (!parsed.ok) {
        window.SetfeedDiscordAuth.clearState();
        const mapped = window.SetfeedDiscordAuth.mapError(parsed.code);
        show(mapped.title, mapped.message);
        renderRecovery(mapped);
        return;
      }

      if (restartIntent === "create_account") {
        try {
          const settledUser = await window.SetfeedDiscordAuth.waitForInitialAuthState(auth);
          if (settledUser) {
            window.SetfeedDiscordAuth.clearState();
            const mapped = window.SetfeedDiscordAuth.mapError("active_session_changed");
            show(mapped.title, mapped.message);
            renderRecovery(mapped);
            return;
          }
        } catch (error) {
          window.SetfeedDiscordAuth.clearState();
          const mapped = window.SetfeedDiscordAuth.mapError(error && error.code, error && error.retryAfter);
          show(mapped.title, mapped.message);
          renderRecovery(mapped);
          return;
        }
      }

      try {
        const exchanged = await window.SetfeedDiscordAuth.exchangeDiscordResult({ auth, resultCode: parsed.resultCode });
        if (exchanged.intent === "create_account" && auth.currentUser) {
          window.SetfeedDiscordAuth.clearState();
          const mapped = window.SetfeedDiscordAuth.mapError("active_session_changed");
          show(mapped.title, mapped.message);
          renderRecovery(mapped);
          return;
        }

        try {
          await auth.signInWithCustomToken(exchanged.firebaseCustomToken);
        } catch (_) {
          window.SetfeedDiscordAuth.clearState();
          const mapped = window.SetfeedDiscordAuth.mapError("firebase_custom_token_sign_in_failed");
          show(mapped.title, mapped.message);
          renderRecovery(mapped);
          return;
        }

        const destination = exchanged.destination;
        const intent = exchanged.intent;
        window.SetfeedDiscordAuth.clearState();
        if (intent === "create_account") {
          show("Setfeed account created", "Redirecting you back to Setfeed…");
        } else {
          show("Signed in", "Redirecting you back to Setfeed…");
        }
        window.location.assign(destination);
      } catch (error) {
        const mapped = window.SetfeedDiscordAuth.mapError(error && error.code, error && error.retryAfter);
        show(mapped.title, mapped.message);
        renderRecovery(mapped);
      }
    })();
  </script>
</body>
</html>
